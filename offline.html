<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Offline | IELTS Tracker</title>
  <meta name="theme-color" content="#F4F3EE">
  <link rel="icon" href="icons/icon-192.png">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/app.css"/>
  <style>
    body { display: grid; place-items: center; padding: 32px 20px; }
    .off { width: 100%; max-width: 400px; text-align: center; display: grid; justify-items: center; gap: 12px; animation: rise .4s cubic-bezier(.2,.8,.2,1); }
    .off-art { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; background: var(--ink); color: var(--signal); margin-bottom: 6px; }
    .off-art .ico { width: 30px; height: 30px; }
    .off h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1; }
    .off h1 em { color: var(--muted); }
    .off p { color: var(--muted); max-width: 32ch; margin-bottom: 10px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .pill.online { background: var(--good-bg); color: var(--good); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  </style>
</head>
<body>
  <main class="off">
    <div class="off-art"><svg class="ico"><use href="icons/sprite.svg#i-wifi-off"/></svg></div>
    <span class="pill" id="liveState"><span class="dot"></span><span>Offline</span></span>
    <h1>You're <em>offline</em></h1>
    <p>Your results are saved on this device. Open the tracker from cache, or reconnect and try again.</p>
    <div class="actions">
      <a class="btn btn-primary" href="main.html"><svg class="ico ico-sm"><use href="icons/sprite.svg#i-layout-dashboard"/></svg>Open tracker</a>
      <button class="btn" type="button" id="checkBtn"><svg class="ico ico-sm"><use href="icons/sprite.svg#i-refresh-cw"/></svg>Check connection</button>
    </div>
  </main>
  <script>
    const live = document.getElementById('liveState');
    function updateStatus() {
      const online = navigator.onLine;
      live.querySelector('span:last-child').textContent = online ? 'Online' : 'Offline';
      live.classList.toggle('online', online);
    }
    document.getElementById('checkBtn').addEventListener('click', () => {
      updateStatus();
      if (navigator.onLine) location.href = 'main.html';
    });
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
